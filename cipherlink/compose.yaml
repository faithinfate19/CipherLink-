services:
  cipherlink:
    build: .
    image: cipherlink:local
    restart: unless-stopped
    init: true
    ports:
      - "${CIPHERLINK_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      CIPHERLINK_DATA_DIR: /app/data
    volumes:
      - cipherlink-data:/app/data

volumes:
  cipherlink-data:
